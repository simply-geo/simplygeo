  <text x="80" y="312" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="600" fill="#a9bccb">für KI-Systeme</text>
  <text x="80" y="380" font-family="Inter, sans-serif" font-size="18" fill="#a9bccb">Vertrauen und Autorität als Grundlage für GEO-Erfolg.</text>
  <line x1="80" y1="415" x2="480" y2="415" stroke="#2e5170" stroke-width="1"/>
  <text x="80" y="445" font-family="Inter, sans-serif" font-size="15" fill="#a9bccb">Einsteiger · 8 Min Lesezeit · 7. März 2025</text>
  <text x="1120" y="600" text-anchor="end" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#a9bccb">Simply<tspan fill="#ff6e40">GEO</tspan></text>
</svg>

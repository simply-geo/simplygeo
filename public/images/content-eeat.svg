    <!-- Experience -->
    <rect x="826" y="160" width="64" height="300" rx="8" fill="#ff6e40" fill-opacity="0.1" stroke="#ff6e40" stroke-width="1" stroke-opacity="0.4"/>
    <text x="858" y="480" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700" fill="#ff6e40" transform="rotate(-90 858 480)">Experience</text>
    <rect x="826" y="300" width="64" height="160" rx="8" fill="#ff6e40" fill-opacity="0.25"/>
    <!-- Expertise -->
    <rect x="906" y="160" width="64" height="300" rx="8" fill="#ff6e40" fill-opacity="0.1" stroke="#ff6e40" stroke-width="1" stroke-opacity="0.4"/>
    <text x="938" y="480" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700" fill="#ff6e40" transform="rotate(-90 938 480)">Expertise</text>
    <rect x="906" y="240" width="64" height="220" rx="8" fill="#ff6e40" fill-opacity="0.25"/>
    <!-- Authoritativeness -->
    <rect x="986" y="160" width="64" height="300" rx="8" fill="#ff6e40" fill-opacity="0.1" stroke="#ff6e40" stroke-width="1" stroke-opacity="0.4"/>
    <text x="1018" y="490" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="10" font-weight="700" fill="#ff6e40" transform="rotate(-90 1018 490)">Authoritativeness</text>
    <rect x="986" y="200" width="64" height="260" rx="8" fill="#ff6e40" fill-opacity="0.25"/>
    <!-- Trust -->
    <rect x="1066" y="160" width="64" height="300" rx="8" fill="#ff6e40" fill-opacity="0.1" stroke="#ff6e40" stroke-width="1" stroke-opacity="0.4"/>
    <text x="1098" y="480" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700" fill="#ff6e40" transform="rotate(-90 1098 480)">Trust</text>
    <rect x="1066" y="160" width="64" height="300" rx="8" fill="#ff6e40" fill-opacity="0.35"/>
  </g>
  <!-- Top glow on highest bar -->
  <circle cx="1098" cy="165" r="16" fill="#ff6e40" fill-opacity="0.25"/>
  <!-- Category chip -->
  <rect x="80" y="80" width="185" height="32" rx="16" fill="#ff6e40" fill-opacity="0.12" stroke="#ff6e40" stroke-opacity="0.35" stroke-width="1"/>
  <text x="172" y="101" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#ff6e40">Content &amp; E-E-A-T</text>

<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <radialGradient id="glow1" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffc13b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffc13b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#ff6e40" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff6e40" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#1e3d59"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid -->
  <g stroke="#2e5170" stroke-width="1" opacity="0.5">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- 5-step process flow -->
  <!-- Step connectors -->
  <g stroke="#ffc13b" stroke-width="1.5" opacity="0.2">
    <line x1="870" y1="175" x2="870" y2="230"/>
    <line x1="870" y1="278" x2="870" y2="330"/>
    <line x1="870" y1="378" x2="870" y2="428"/>
    <line x1="870" y1="476" x2="870" y2="510"/>
  </g>

  <!-- Step circles -->
  <g>
    <!-- Phase 1 -->
    <circle cx="870" cy="152" r="22" fill="#16304a" stroke="#ffc13b" stroke-width="1.5" opacity="0.8"/>
    <text x="870" y="158" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#ffc13b">1</text>
    <text x="904" y="158" font-family="Inter, sans-serif" font-size="13" fill="#a9bccb">Technische Basis</text>

    <!-- Phase 2 -->
    <circle cx="870" cy="254" r="22" fill="#16304a" stroke="#ffc13b" stroke-width="1.5" opacity="0.7"/>
    <text x="870" y="260" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#ffc13b">2</text>
    <text x="904" y="260" font-family="Inter, sans-serif" font-size="13" fill="#a9bccb">Content-Analyse</text>

    <!-- Phase 3 -->
    <circle cx="870" cy="354" r="22" fill="#16304a" stroke="#ffc13b" stroke-width="1.5" opacity="0.6"/>
    <text x="870" y="360" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#ffc13b">3</text>
    <text x="904" y="360" font-family="Inter, sans-serif" font-size="13" fill="#a9bccb">Schema Markup</text>

    <!-- Phase 4 -->
    <circle cx="870" cy="452" r="22" fill="#16304a" stroke="#ffc13b" stroke-width="1.5" opacity="0.5"/>
    <text x="870" y="458" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#ffc13b">4</text>
    <text x="904" y="458" font-family="Inter, sans-serif" font-size="13" fill="#a9bccb">E-E-A-T Bewertung</text>

    <!-- Phase 5 -->
    <circle cx="870" cy="528" r="22" fill="#ffc13b" fill-opacity="0.15" stroke="#ffc13b" stroke-width="2"/>
    <text x="870" y="534" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#ffc13b">5</text>
    <text x="904" y="534" font-family="Inter, sans-serif" font-size="13" fill="#f5f0e1" font-weight="600">KI-Sichtbarkeit testen</text>
  </g>

  <!-- Glow on step 5 -->
  <circle cx="870" cy="528" r="40" fill="#ffc13b" fill-opacity="0.05"/>

  <!-- Decorative chart bars (right side) -->
  <g fill="#ffc13b" opacity="0.15">
    <rect x="1060" y="320" width="30" height="160" rx="4"/>
    <rect x="1030" y="370" width="22" height="110" rx="4"/>
    <rect x="1095" y="280" width="22" height="200" rx="4"/>
  </g>
  <g fill="#ffc13b" opacity="0.5">
    <rect x="1060" y="320" width="30" height="30" rx="4"/>
    <rect x="1030" y="370" width="22" height="22" rx="4"/>
    <rect x="1095" y="280" width="22" height="22" rx="4"/>
  </g>

  <!-- Category chip -->
  <rect x="80" y="80" width="180" height="32" rx="16" fill="#ffc13b" fill-opacity="0.12" stroke="#ffc13b" stroke-opacity="0.35" stroke-width="1"/>
  <text x="170" y="101" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#ffc13b">Tools &amp; Messung</text>

  <!-- Title -->
  <text x="80" y="200" font-family="Space Grotesk, sans-serif" font-size="50" font-weight="700" fill="#f5f0e1">Mein GEO-Audit Prozess</text>
  <text x="80" y="260" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="600" fill="#ffc13b">So analysiere ich Websites</text>
  <text x="80" y="305" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="600" fill="#a9bccb">für KI-Sichtbarkeit</text>

  <text x="80" y="375" font-family="Inter, sans-serif" font-size="18" fill="#a9bccb">5 Phasen: von der technischen Basis bis zum KI-Test.</text>

  <line x1="80" y1="410" x2="480" y2="410" stroke="#2e5170" stroke-width="1"/>
  <text x="80" y="440" font-family="Inter, sans-serif" font-size="15" fill="#a9bccb">Fortgeschritten · 18 Min Lesezeit · 4. Juli 2026</text>

  <text x="1120" y="600" text-anchor="end" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#a9bccb">Simply<tspan fill="#ff6e40">GEO</tspan></text>
</svg>

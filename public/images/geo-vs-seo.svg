<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <radialGradient id="glow1" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c2ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00c2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00e5a0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#070d1a"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid -->
  <g stroke="#1a2d4a" stroke-width="1" opacity="0.5">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Two columns visual -->
  <rect x="820" y="110" width="140" height="36" rx="8" fill="#00c2ff" fill-opacity="0.12" stroke="#00c2ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="890" y="133" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#00c2ff">GEO</text>
  <rect x="990" y="110" width="140" height="36" rx="8" fill="#00e5a0" fill-opacity="0.12" stroke="#00e5a0" stroke-width="1" stroke-opacity="0.4"/>
  <text x="1060" y="133" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#00e5a0">SEO</text>

  <!-- Divider line between columns -->
  <line x1="965" y1="100" x2="965" y2="500" stroke="#1a2d4a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="965" cy="300" r="20" fill="#0e1829" stroke="#1a2d4a" stroke-width="1.5"/>
  <text x="965" y="305" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="700" fill="#6b84a3">VS</text>

  <!-- GEO side nodes -->
  <g fill="#00c2ff" opacity="0.8">
    <circle cx="840" cy="200" r="5"/><circle cx="870" cy="260" r="4"/>
    <circle cx="900" cy="330" r="6"/><circle cx="850" cy="400" r="4"/>
    <circle cx="920" cy="450" r="5"/>
  </g>
  <g stroke="#00c2ff" stroke-width="1" opacity="0.25" fill="none">
    <line x1="840" y1="200" x2="870" y2="260"/>
    <line x1="870" y1="260" x2="900" y2="330"/>
    <line x1="900" y1="330" x2="850" y2="400"/>
    <line x1="850" y1="400" x2="920" y2="450"/>
  </g>

  <!-- SEO side nodes -->
  <g fill="#00e5a0" opacity="0.8">
    <circle cx="1090" cy="200" r="5"/><circle cx="1060" cy="260" r="4"/>
    <circle cx="1030" cy="330" r="6"/><circle cx="1080" cy="400" r="4"/>
    <circle cx="1010" cy="450" r="5"/>
  </g>
  <g stroke="#00e5a0" stroke-width="1" opacity="0.25" fill="none">
    <line x1="1090" y1="200" x2="1060" y2="260"/>
    <line x1="1060" y1="260" x2="1030" y2="330"/>
    <line x1="1030" y1="330" x2="1080" y2="400"/>
    <line x1="1080" y1="400" x2="1010" y2="450"/>
  </g>

  <!-- Category chip -->
  <rect x="80" y="80" width="180" height="32" rx="16" fill="#00c2ff" fill-opacity="0.12" stroke="#00c2ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="170" y="101" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#00c2ff">GEO Grundlagen</text>

  <!-- Title -->
  <text x="80" y="210" font-family="Space Grotesk, sans-serif" font-size="54" font-weight="700" fill="#e8f0fe">GEO vs. klassisches SEO</text>
  <text x="80" y="280" font-family="Space Grotesk, sans-serif" font-size="34" font-weight="600" fill="#00c2ff">Was ist der Unterschied?</text>

  <!-- Description -->
  <text x="80" y="360" font-family="Inter, sans-serif" font-size="20" fill="#6b84a3">Überschneidungen, Unterschiede — und warum du beides brauchst.</text>

  <line x1="80" y1="400" x2="500" y2="400" stroke="#1a2d4a" stroke-width="1"/>
  <text x="80" y="430" font-family="Inter, sans-serif" font-size="15" fill="#6b84a3">Einsteiger · 6 Min Lesezeit · 17. Januar 2025</text>

  <text x="1120" y="600" text-anchor="end" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#6b84a3">Simply<tspan fill="#00c2ff">GEO</tspan></text>
</svg>

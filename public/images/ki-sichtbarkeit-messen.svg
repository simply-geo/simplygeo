<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <radialGradient id="glow1" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffc13b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffc13b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#ff6e40" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff6e40" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#1a365d"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid -->
  <g stroke="#2e5170" stroke-width="1" opacity="0.5">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Dashboard card: bar chart (share of voice) -->
  <g>
    <rect x="120" y="140" width="420" height="350" rx="14" fill="#20406a" stroke="#2e5170" stroke-width="1.5"/>
    <text x="150" y="185" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="700" fill="#6fb1d8">SHARE OF VOICE</text>
    <!-- bars -->
    <rect x="160" y="330" width="52" height="120" rx="4" fill="#ffc13b"/>
    <rect x="232" y="290" width="52" height="160" rx="4" fill="#ffc13b" opacity="0.85"/>
    <rect x="304" y="370" width="52" height="80" rx="4" fill="#5c7186"/>
    <rect x="376" y="350" width="52" height="100" rx="4" fill="#5c7186"/>
    <rect x="448" y="395" width="52" height="55" rx="4" fill="#5c7186"/>
    <line x1="150" y1="452" x2="510" y2="452" stroke="#3b5c80" stroke-width="1.5"/>
    <text x="186" y="318" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#a9bccb">Du</text>
    <text x="330" y="358" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#a9bccb">Konk.</text>
  </g>

  <!-- Metric tiles right -->
  <g>
    <rect x="600" y="140" width="220" height="105" rx="12" fill="#20406a" stroke="#2e5170" stroke-width="1.5"/>
    <text x="622" y="178" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" fill="#6fb1d8">MENTIONS</text>
    <text x="622" y="222" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700" fill="#ffc13b">»Marke«</text>

    <rect x="850" y="140" width="220" height="105" rx="12" fill="#20406a" stroke="#2e5170" stroke-width="1.5"/>
    <text x="872" y="178" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" fill="#6fb1d8">CITATIONS</text>
    <text x="872" y="222" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700" fill="#ff6e40">[1] Quelle</text>

    <!-- Trend line card -->
    <rect x="600" y="275" width="470" height="215" rx="14" fill="#20406a" stroke="#2e5170" stroke-width="1.5"/>
    <text x="622" y="313" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" fill="#6fb1d8">VISIBILITY SCORE</text>
    <polyline points="630,445 700,432 770,438 840,400 910,388 980,352 1045,330"
      fill="none" stroke="#ffc13b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1045" cy="330" r="7" fill="#ffc13b"/>
    <polyline points="630,455 700,452 770,458 840,450 910,455 980,448 1045,450"
      fill="none" stroke="#5c7186" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
    <text x="1040" y="312" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#a9bccb">3 Monate, ein Trend</text>
  </g>

  <!-- Magnifier motif bottom left -->
  <g transform="translate(150,530)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#ff6e40" stroke-width="4"/>
    <line x1="19" y1="19" x2="42" y2="42" stroke="#ff6e40" stroke-width="4" stroke-linecap="round"/>
    <text x="66" y="8" font-family="Inter, sans-serif" font-size="14" fill="#a9bccb">Messen statt raten: Mentions · Citations · Referrals</text>
  </g>
</svg>

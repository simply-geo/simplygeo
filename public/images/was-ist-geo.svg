<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff6e40" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff6e40" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#ffc13b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffc13b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a365d"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid lines -->
  <g stroke="#2e5170" stroke-width="1" opacity="0.6">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Connection lines -->
  <g stroke="#ff6e40" stroke-width="1.5" opacity="0.3">
    <line x1="860" y1="140" x2="980" y2="220"/>
    <line x1="980" y1="220" x2="1060" y2="160"/>
    <line x1="1060" y1="160" x2="1100" y2="280"/>
    <line x1="860" y1="140" x2="920" y2="300"/>
    <line x1="920" y1="300" x2="1060" y2="340"/>
    <line x1="1060" y1="340" x2="1100" y2="280"/>
  </g>

  <!-- Nodes -->
  <g fill="#ff6e40">
    <circle cx="860" cy="140" r="6"/>
    <circle cx="980" cy="220" r="8"/>
    <circle cx="1060" cy="160" r="5"/>
    <circle cx="1100" cy="280" r="7"/>
    <circle cx="920" cy="300" r="5"/>
    <circle cx="1060" cy="340" r="6"/>
  </g>
  <g fill="#ff6e40" opacity="0.3">
    <circle cx="860" cy="140" r="18"/>
    <circle cx="980" cy="220" r="22"/>
    <circle cx="1100" cy="280" r="20"/>
  </g>

  <!-- Decorative arc -->
  <circle cx="980" cy="220" r="80" fill="none" stroke="#ff6e40" stroke-width="1" stroke-dasharray="6 4" opacity="0.2"/>
  <circle cx="980" cy="220" r="130" fill="none" stroke="#ff6e40" stroke-width="1" stroke-dasharray="3 8" opacity="0.12"/>

  <!-- Category chip -->
  <rect x="80" y="80" width="180" height="32" rx="16" fill="#ff6e40" fill-opacity="0.12" stroke="#ff6e40" stroke-opacity="0.3" stroke-width="1"/>
  <text x="170" y="101" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#ff6e40">GEO Grundlagen</text>

  <!-- Main title -->
  <text x="80" y="210" font-family="Space Grotesk, sans-serif" font-size="58" font-weight="700" fill="#f5f0e1">Was ist GEO?</text>
  <text x="80" y="285" font-family="Space Grotesk, sans-serif" font-size="38" font-weight="600" fill="#ff6e40">Generative Engine Optimization</text>
  <text x="80" y="340" font-family="Space Grotesk, sans-serif" font-size="38" font-weight="600" fill="#a9bccb">einfach erklärt</text>

  <!-- Description -->
  <text x="80" y="410" font-family="Inter, sans-serif" font-size="20" fill="#a9bccb">Wie KI-Suchsysteme funktionieren und wie du darin sichtbar wirst.</text>

  <!-- Divider -->
  <line x1="80" y1="445" x2="500" y2="445" stroke="#2e5170" stroke-width="1"/>

  <!-- Meta info -->
  <text x="80" y="475" font-family="Inter, sans-serif" font-size="15" fill="#a9bccb">Einsteiger · 8 Min Lesezeit · 4. Juli 2026</text>

  <!-- SimplyGEO Logo -->
  <text x="1120" y="600" text-anchor="end" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#a9bccb">Simply<tspan fill="#ff6e40">GEO</tspan></text>
</svg>
